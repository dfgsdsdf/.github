# ======================================================
# Here you can create your own player quests interface.
#
# Never delete a %variable% unless you know what you're doing.
# %achieved% is replaced by the number of completed quests.
# %drawIn% is replaced by the time remaining before the next quests draw.
# ======================================================
player_interface:
  size: 27
  inventory_name: "&fꐮꂚ ꐲꐰꐮꐭꐬ#3b3b3bDaily Quests &m                         "
  # disable the status of the quest if you want to handle it manually by placeholders
  disable_status: false
  # the 3 following lines will not be used if disable_status is set to true
  status: "&a"
  progress: "#fff3ad┅ ɪɴ ᴘʀᴏɢʀᴇss &8(#ffdcad%progress%&7/#b39978%required%&8)"
  achieved: "#c0ffad✔ ᴄᴏᴍᴘʟᴇᴛᴇᴅ"
  # if you want to glow the item when the quest is achieved
  glowing_if_achieved: false
  complete_get_type: "&eClick to complete this quest !"
  player_head:
    enabled: false
    slot: 5
    item_name: "&bYour quests"
    item_description:
      - "&eCompleted quests : &b%achieved%&e/&63"
      - "&eNext draw in : &c%drawIn%"

  # ========================================================
  # Available types : FILL, PLAYER_COMMAND, CONSOLE_COMMAND
  # Placeholders : %player%
  # More info on Wiki.
  # ========================================================
  quests: # set the position of quests items
    1: 
      - 4
      - 5
      - 13
      - 14
      - 22
      - 23
    2: 
      - 6
      - 7
      - 15
      - 16
      - 24
      - 25
    3: 
      - 8
      - 9
      - 17
      - 18
      - 26
      - 27
  items:
    0:
      type: CONSOLE_COMMAND
      use_placeholders: true
      item:
        material: BARRIER
        custom_model_data: 1
        name: "#91c9a1             Tʜᴇ Qᴜᴇsᴛᴇʀ             "
        lore: 
          - "           &8&m                    "
          - "#61876c⭐ #7e877fThe Quester assigns 3 random"
          - "#7e877fquests every day. Completing them"
          - "#7e877fgives #bcecf7stardust#7e877f and many rewards."
          - ""
          - "#61876c⭐ #7e877fQuests come in 3 difficulties:"
          - "  #4e59de&lJACK &r&8→ #db4da0&lQUEEN &r&8→ #e09443&lKING"
          - "#7e877fHigher difficulty gives better loot."
          - ""
          - "#61876c⭐ #7e877fReach Quests Milestone through"
          - "#7e877fdoing specific number of quests."
          - ""
          - "#61876c⌛ #9cdbad%odailyquests_drawin% #6e997aleft before next draw."
          - "#61876c✔ #9cdbad%odailyquests_total% #6e997atotal quests completed."
          - ""
          - "#3c473f→ Click to open milestones tracker!"
        slot: 
          - 1
          - 2
          - 3
          - 10
          - 11
          - 12
          - 19
          - 20
          - 21
      commands:
        - "cp milestone %player%" 