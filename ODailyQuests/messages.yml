# NEVER DELETE A %variable%
# Messages support HEX colours codes.

player_help: |
  &a&nКоманды игрока:
  &e/dq me &a: посмотреть свои задания
  &e/dq reroll <index> &a: перезапустить задание (требуется право)
  &e/dq show <global/easy/medium/hard> &a: посмотреть задания категории
admin_help: |
  &c&nКоманды администратора:
  &e/dqa complete <player> <index> &a: завершить задание игрока
  &e/dqa customcomplete <player> <index> <amount> &a: завершить задание игрока from a custom type
  &e/dqa reset <quests/total> <player> &a: выдать игроку новые задания или сбросить его общее число выполненных заданий.
  &e/dqa add total <player> <amount> &a: add a number of achieved quests to a player.
  &e/dqa reroll <player> <index> &a: draw a new quest for a player, at a specific index.
  &e/dqa show <player> &a: see quests of a player
