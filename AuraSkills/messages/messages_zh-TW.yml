    self_bleeding: <red>你流血了!
    stop: <white>已停止流血
  anti_hunger:
    name: 抗飢餓
    desc: '{value}% 機率停止飢餓值損耗.'
    info: '{value}% 沒有飢餓值損耗'
  runner:
    name: 跑者
    desc: 獲得{value}%耐力經驗.
    info: +{value}% 經驗
  golden_heal:
    name: 黃金治療
    desc: 加強恢復效果使生命值提升{value}%
    info: +{value}% 恢復效果
  recovery:
    name: 恢復
    desc: 生命值不足一半時提高自然恢復 {value}%
    info: +{value} 低血量恢復
  meal_steal:
    name: 飢餓竊取
    desc: 攻擊玩家有{value}%機率竊取1個飢餓值
    info: '{value}% 飢餓竊取'
  light_fall:
    name: 輕盈
    desc: 降低 {value}% 摔落傷害
    info: -{value}% 摔落傷害
  jumper:
    name: 跳躍者
    desc: 獲得{value}% 敏捷經驗
    info: +{value}% 敏捷經驗
  sugar_rush:
    name: 衝刺之糖
    desc: 提升飛濺速度藥水與跳躍藥水{value}% 的持續時間
    info: '{value}% 持續速度'
  fleeting:
    name: 迅速
    desc: Gain +{value} Speed when below 20% health.
    info: +{value}% 速度
    start: <white>你獲得了短暫的速度提升! <#cccccc>(+{value}% 速度)
    end: <#cccccc>速度提升已失效
  thunder_fall:
    name: 雷暴
    desc: 在摔落時潛行, 有 {value}%機率對3格範圍的怪物造成{value_2}% 摔落傷害
    info: '{value}% 機率, 造成 {value_2} 傷害'
  alchemist:
    name: 釀造師
    desc: 釀造的藥水延長{value}% 持續時間
    info: +{value}% 藥水持續時間
  brewer:
    name: 釀造
    desc: 獲得{value}% 釀造經驗
    info: +{value}% 釀造經驗
  splasher:
    name: 飛濺
    desc: 飛濺的藥水會使每個受影響的玩家, 獲得{value}%的持續時間
    info: +{value}% 持續時間/玩家
  lingering:
    name: 滯留
    desc: 滯留藥水自然衰減 {value}% 每個受影響的實體衰減 {value_2}%
    info: -{value}% 自然衰減, -{value_2}% 實體衰減
  wise_effect:
    name: 明智
    desc: 每個獨特的活性藥水, 可獲得+{value} 智慧
    info: +{value} 智慧/效果
  xp_convert:
    name: 經驗轉換
    desc: 每獲得 {value} 點技能經驗可以額外獲得 1 點原版的經驗值.
    info: 1 經驗值/{value} 技能經驗
  enchanter:
    name: 附魔師
    desc: 獲得額外的 {value}% 附魔經驗
    info: +{value}% 附魔經驗
  xp_warrior:
    name: 經驗戰士
    desc: 你殺死的怪物有 {value}% 掉落兩倍的經驗。
    info: '{value}% 兩倍的打怪經驗'
  enchanted_strength:
    name: 魔法力量
    desc: 手持物品上的附魔能額外讓你獲得 +{value} 力量
    info: '{value} 力量/附魔'
  lucky_table:
    name: 幸運附魔台
    desc: 您使用附魔的物品附魔台有 {value}% 的機率升級附魔如果不是最高等級，則等級為 1
    info: '{value}% 附魔升級機率'
  life_essence:
    name: 生命本質
    desc: 瞬間恢復藥水能額外回復 {value}% 血量
    info: +{value}% 額外回復血量
  healer:
    name: 治癒者
    desc: 獲得額外的 {value}% 治療經驗
    info: +{value}% 治療經驗
  life_steal:
    name: 生命竊取
    desc: 擊殺的怪物或玩家可以為你回復{value}%的血量.
    info: 竊取 {value}% 的血量
  golden_heart:
    name: 黄金之心
    desc: 對吸收之心造成的傷害降低 {value}%
    info: -{value}% 黃金之心受到的傷害
  revival:
    name: 重獲生機
    desc: 重生後獲得 &c+{value} 生命值和 &6+{value_2} 恢復持續 30 秒.
    info: +{value} 點血量，+{value_2} 回復效果
    message: <white>你獲得了 30 秒的重生獎勵！ <white>(<red>+{value} 血量, <gold>+{value_2} 回復效果<white>)
  disenchanter:
    name: 去除附魔者
    desc: 使用切石機分解物品時獲得的經驗值提高 {value}%.
    info: +{value}% 切石機經驗
  forger:
    name: 鍛造者
    desc: 獲得額外的 {value}% 鍛造經驗
    info: +{value}% 鍛造經驗
  repairing:
    name: 重鑄
    desc: 物品使用原材料在鐵砧修理, 可額外恢復 {value}% 的耐久度.
    info: +{value}% 鐵砧修復值
  anvil_master:
    name: 鐵砧大師
    desc: 增加鐵砧的最大維修成本, 以免{value} 經驗值太貴.
    info: '{value} 最高成本'
  skill_mender:
    name: 技能修復者
    desc: 獲得技能經驗有 {value}% 的機率修復持有的物品或損壞的盔甲, 每 2 個技能經驗增加1點耐久度.
    info: '{value}% 修復機率'
acf:
  core:
    permission_denied: 很抱歉, 你沒有權限執行這個指令
