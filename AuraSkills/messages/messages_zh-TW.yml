    help_search_header: <yellow>=== <green>{commandprefix}{command} {search} <aqua>的搜尋結果<yellow>
      ===
  minecraft:
    invalid_world: '<red>錯誤: 這個世界不存在.'
    you_must_be_holding_item: '<red>錯誤: 你得必須要拿著一個物品.'
    player_is_vanished_confirm: |-
      <yellow>警告: <green>{vanished} <yellow>已消失. 不要覆蓋!
      <yellow>要確認這個操作,請在名稱尾部增加 <green>:confirm.
      <yellow>例如: {vanished}:confirm
    username_too_short: '<red>錯誤: 名稱太短, 至少需要3個字.'
    is_not_a_valid_name: '<red>錯誤: <yellow>{name} <red>不是有效的名稱.'
