  fighter:
    name: 戰鬥
    desc: 獲得{value}% 戰鬥經驗
    info: +{value}% 經驗
  sword_master:
    name: 劍術師
    desc: 增加{value}% 劍造成的傷害
    info: +{value}% 劍傷害
  first_strike:
    name: 第一擊
    desc: 增加{value}% 第一擊造成的傷害
    info: +{value}% 第一擊
