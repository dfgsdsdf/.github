    no_player_found_offline: <red>沒有找到符合 <yellow>{search}<red> 的玩家.
    no_player_found: <red>沒有找到符合 <yellow>{search}<red> 的玩家.
    location_please_specify_world: '<red>錯誤: 請指定世界座標. 例如: <yellow>world:x,y,z.'
    location_please_specify_xyz: '<red>錯誤: 請指定座標 x, y, z. 例如: <yellow>world:x,y,z.'
    location_console_not_relative: '<red>錯誤: 控制台不能使用相對坐標作為位置.'
commands:
  prefix: '<dark_#83ca16>[<aqua>Skills<dark_#83ca16>]<reset> '
  armor:
    modifier:
      add:
        added: <#cccccc>物品已添加{color}{stat} <aqua>{value} <#cccccc>屬性
        already_exists: <yellow>裝備屬性 {color}{stat} <yellow>已經存在! 請先使用 /sk armor modifier
          remove 刪除
      remove:
        does_not_exist: <yellow>你的物品沒有 {color}{stat} <yellow>的屬性!
        removed: 已經從你的物品刪除{color}{stat} <#cccccc>屬性
      list:
        header: '<white>找到的裝備屬性:'
      removeall:
        removed: <#cccccc>物品已刪除全部裝備屬性
    multiplier:
      add:
        added: <aqua>{target} <#cccccc>multiplier with value <aqua>{value} <#cccccc>was
          added to your item
        already_exists: <yellow>An armor multiplier with target <aqua>{target} <yellow>already
          exists on your armor! Remove it first with /sk armor multiplier remove
        skill_lore: '<#cccccc>When worn: <aqua>+{value}% {skill} XP'
        skill_lore_subtract: '<#cccccc>When worn: <aqua>-{value}% {skill} XP'
        global_lore: '<#cccccc>When worn: <blue>+{value}% Skill XP'
        global_lore_subtract: '<#cccccc>When worn: <blue>-{value}% Skill XP'
      remove:
        does_not_exist: <yellow>Your item does not have a <aqua>{target} <yellow>armor
          multiplier!
        removed: <aqua>{target} <#cccccc>armor multiplier was removed from your item
      list:
        header: '<white>Armor multipliers found:'
      removeall:
        removed: <#cccccc>All armor multipliers have been removed from your item
    requirement:
      add:
        added: 已將<dark_aqua>{skill}<#cccccc> <aqua> {level} <#cccccc>的裝備要求添加到你的物品中
        already_exists: <yellow>物品已經具有 <dark_aqua>{skill}<yellow> 裝備要求! 請先刪除<gold>/sk
          armor requirement remove
        lore: <red>需要 <dark_aqua>{skill} {level}
      remove:
        does_not_exist: <yellow>你的物品沒有 <dark_aqua>{skill}<yellow> 裝備要求!
        removed: 已經將 <dark_aqua>{skill}<#cccccc> 裝備要求從你的物品中移除
      list:
        header: '<white>找到的裝備要求:'
      removeall:
        removed: <#cccccc>全部裝備要求已從你的物品刪除
      equip: <yellow>你沒有裝備這個物品的條件!
    trait:
      add:
        already_exists: <yellow>物品上已存在具有 {trait} 特質的裝甲修飾符！請先使用 /sk armor trait remove
          將其刪除
  backup:
    load:
      confirm: <red>Loading a backup will revert all skill data of players. This action
        is permanent and cannot be undone. You may want to save a backup before loading
        one. Type the command again to confirm this action
      loading: <white>Loading backup...
      loaded: <green>Successfully loaded backup
      error: '<red>Error loading backup: {error}'
      must_be_yaml: <yellow>File must be a .yml file!
      file_not_found: <yellow>A backup of this file name does not exist in the backups
        folder!
    save:
      saving: <white>Saving backup...
      saved: <white>Backed up {type} data as {file}
      error: <red>Error backing up {type} data! See error in console/below for details
  claimitems:
    no_items: <yellow>You have no items to claim
  item:
    give:
      sender: <white>Gave <aqua>{amount}x {key} <white>to {player}
      receiver: <white>You were given <aqua>{amount}x {key}
    modifier:
      add:
        added: 物品已添加{color}{stat} <aqua>{value} 屬性
        already_exists: <yellow>裝備屬性 {color}{stat} <yellow>已經存在! 請先使用 /sk armor modifier
          remove 刪除
      remove:
        does_not_exist: <yellow>你的物品沒有 {color}{stat} <yellow>的屬性!
        removed: <#cccccc>已經從你的物品刪除{color}{stat} 屬性
      list:
        header: '<white>找到的物品屬性:'
      removeall:
        removed: <#cccccc>你的物品已刪除全部屬性
    multiplier:
      add:
        added: <aqua>{target} <#cccccc>multiplier with value <aqua>{value} <#cccccc>was
          added to your item
        already_exists: <yellow>An item multiplier with target <aqua>{target} <yellow>already
          exists on your item! Remove it first with /sk item multiplier remove
        skill_lore: '<#cccccc>When held: <aqua>+{value}% {skill} XP'
        skill_lore_subtract: '<#cccccc>When held: <aqua>-{value}% {skill} XP'
        global_lore: '<#cccccc>When held: <blue>+{value}% Skill XP'
        global_lore_subtract: '<#cccccc>When held: <blue>-{value}% Skill XP'
      remove:
        does_not_exist: <yellow>Your item does not have a <aqua>{target} <yellow>item
          multiplier!
        removed: <aqua>{target} <#cccccc>item multiplier was removed from your item
      list:
        header: '<white>Item multipliers found:'
      removeall:
        removed: <#cccccc>All item multipliers have been removed from your item
    register:
      registered: <white>Registered held item to key {key}
      already_registered: <yellow>There is already an item registered to key <white>{key}<yellow>,
        use <white>/skills item unregister <yellow>to unregister it first
      no_spaces: <yellow>Item key cannot contain spaces!
    requirement:
