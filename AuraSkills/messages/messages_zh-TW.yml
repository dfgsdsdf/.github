    desc: 獲得{value}% 伐木經驗.
    info: +{value}% 經驗
  axe_master:
    name: 斧頭大師
    desc: 增加斧頭{value}% 傷害
    info: +{value}% 斧頭傷害
  valor:
    name: 勇者
    desc: 手持斧頭時可獲得+{value} 強度
    info: +{value} 強度
  shredder:
