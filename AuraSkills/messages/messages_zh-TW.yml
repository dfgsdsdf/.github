  lucky_catch:
    name: 幸運爪子
    desc: Grants +{value} Fishing Luck, which increases the chance for extra drops.
    info: +{value} Fishing Luck
  fisher:
    name: 漁夫
    desc: 獲得{value}% 額外的釣魚經驗
    info: +{value}% 經驗
  treasure_hunter:
    name: 寶藏獵人
    desc: 有{value}% 機率釣到罕見寶物.
    info: '{value}% 罕見寶物'
  grappler:
    name: 鉤爪
    desc: 增加{value}% 釣魚速度
    info: +{value}% 釣魚速度
  epic_catch:
    name: 史詩級寶物
    desc: 有{value}% 機率釣到史詩級寶物.
