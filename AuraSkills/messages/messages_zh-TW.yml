  archer:
    name: 弓箭手
    desc: 獲得{value}% 射箭經驗.
    info: +{value}% 經驗
  bow_master:
    name: 弓箭大師
    desc: 增加{value}% 弓箭造成的傷害
    info: +{value}% 弓箭傷害
  piercing:
    name: 穿刺
