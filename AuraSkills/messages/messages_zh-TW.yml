    info: '{value}% 穿刺機率'
  stun:
    name: 眩晕
    desc: 有{value}% 的機率使敵人的移動速度降低20％, 持續2秒.
    info: '{value}% 暈眩機率'
  shielding:
    name: 盾
    desc: 潛行時減少{value}% 傷害
    info: -{value}%潛行傷害
  defender:
    name: 防禦
    desc: 獲得{value}% 防禦經驗
    info: +{value}% 經驗
  mob_master:
    name: 怪物大師
    desc: 減少{value}% 怪物攻擊傷害
    info: -{value}% 怪物攻擊傷害
  immunity:
    name: 抵抗力
    desc: '{value}% 機率不受敵人攻擊傷害.'
