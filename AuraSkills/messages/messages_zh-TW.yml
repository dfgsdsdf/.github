abilities:
  bountiful_harvest:
    name: 豐收
    desc: Grants +{value} Farming Luck, which increases the chance for extra drops.
    info: +{value} Farming Luck
  farmer:
    name: 農夫
    desc: 獲得{value}% 額外的農業經驗.
    info: +{value}% 經驗
  scythe_master:
    name: 鐮刀大師
    desc: 增加鋤頭{value}% 傷害
    info: +{value}% 鋤頭傷害
  geneticist:
    name: 遺傳學家
    desc: 從蔬菜增加{value}% 飽和度
    info: +{value} 飽和度
  growth_aura:
    name: 生長光環
    desc: Crops with growth stages within {radius} blocks of you grow {value}% faster.
    info: +{value}% Growth
  lumberjack:
    name: 伐木工
