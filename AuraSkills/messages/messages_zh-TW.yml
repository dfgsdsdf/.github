    desc: 有{value}% 機率挖到罕見寶物.
    info: '{value}% 罕見寶物'
  excavator:
    name: 挖掘机
    desc: 獲得{value}% 額外的挖礦經驗
    info: +{value}% 經驗
  spade_master:
    name: 圓鍬大師
    desc: 增加{value}% 鏟子造成的傷害
