# PlayerAuctions by Olzie-12
# https://www.spigotmc.org/resources/83073
# We also have a discord server for help: https://olziedev.com/discord or check docs https://docs.olziedev.com/projects/playerauctions
# Also if you find any bugs be happy to report them I will fix them :)
# Made with love

myauctions:
  # Should you enable my auctions gui meaning players will be able to view their auctions?
  enabled: true
  # What is the name of the gui?
  name: "myauctions"
  # The title of the gui (Can use color codes)
  title: "&fꐮꀲ ꐲꐰꐯꐢꐠ[page]/[pages] ꐤꐬ🔎 {#c9c9c9}No Search Filter."
  # What is the size of this GUI? (multiples of 9 can only go up to 54)
  size: 54
  # What are the actions when this menu is opened up?
  open-actions: 
  - "[sound] UI_BUTTON_CLICK"
  # What are the actions when this menu is closed?
  close-actions: []
  # Should the page items be removed if there is page for that button. E.g. you're on page 0, it won't show the previous item.
  # You can also put an item where this page item is, and it'll only show if the page item isn't there.
  show-needed-page-items: false
  # Should the menu just instantly cancel the auction and collect the item for the player?
  cancel-collect: false
  # What are the blacklisted slots that auctions will not appear in the GUI?
  # This is useful if you want to add empty slots in the middle of the GUI instead of having an item there instead.
  blacklisted-slots: ["46", "47", "48", "50", "51"]

  limit-placeholder:
    enabled: true
    material: "BOOK"
    custom-model-data: 80
    data: 0
    name: "{#e87676}Locked auction slot"
    lore:
    - "{#e3e3e3}Unlock this slot with ranks!"
  available-placeholder:
    enabled: true
    material: "BOOK"
    custom-model-data: 79
    data: 0
    name: "{#87e876}Available auction slot"
    lore:
    - "{#e3e3e3}You can sell items via &f/ah sell"

  # Searching for auctions through the GUI
  search:
    # Should the feature be enabled?
    # You will need ProtocolLib for this to work.
    enabled: true
    # What is the title for the inventory?
    title: "&f㋠ [page]/[pages] 🔎 {#4d69c4}[search]."
    # What are the premade lines in the sign? %search% is the variable they have to enter the auction in.
    lines:
      - "%search%"
      - "----------------"
      - "Please enter a"
      - "search result."
    # This is the sign material that will be used for the search. This is only allowed to be a sign.
    material: OAK_SIGN
    
    item:
      material: BARRIER
      custom-model-data: 1
      name: "{#6d71c9}🔎 Search For Item"
      lore:
        - "&a "
        - "{#4d508a}Search an item by:"
        - "&f Full IGN"
        - "&f Item name/Item type"
        - "&f Auction ID"
        - " "
        - "&fꂀ {#83ca16}Search."
      slot: 49
      amount: 1
      glowing: false
      commands:
      - "[sound] BLOCK_NOTE_BLOCK_HAT"

  icon:
    price-per-item: "&8([price_item] each)"
    none-price-per-item: ""
    enchants-entry: "&d[enchant] [level]\n"
    no-enchants-entry: "&cNone"
    repair-cost: "&bRepair Cost: &e[repair_cost] XP"
    no-repair-cost: ""

    item-flags:
      - "HIDE_ATTRIBUTES"
    name: ""
    lore:
      - "[lore]"
      - ""
      - "{#828aab}ʙᴜʏ ɴᴏᴡ ғᴏʀ {#d1884f}[price] [price_item]"
      - "{#828aab}sᴏʟᴅ ʙʏ &f[seller]"
      - "{#8a544d}ᴇxᴘɪʀᴇs ɪɴ &f[expire]"
      - " "
      - "&fꂀ {#83ca16}Cancel this auction."
      - "&b[delauction]"
    # What are the commands that are ran when a player clicks on an auction?
    commands: []

  clickable-items:
    next-page:
      # This is the name of the next page item
      # If you wish to disable any of these please set them the material to "AIR"
      name: "{#4d548a}Next Page →"
      # this is the material of the next page item. valid material names: https://javadocs.olziedev.com/spigot/latest/org/bukkit/Material.html
      material: BARRIER
      custom-model-data: 1
      data: 0
      lore:
        - "&7Go to next page."
      slot: 50
      amount: 1
      glowing: false
      commands:
      - "[sound] BLOCK_NOTE_BLOCK_HAT"
      commands:
      - "[sound] BLOCK_NOTE_BLOCK_HAT"
      # These only work if the skull is a PLAYER_HEAD and the data is 3!
      #texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMWE0ZjY4YzhmYjI3OWU1MGFiNzg2ZjlmYTU0Yzg4Y2E0ZWNmZTFlYjVmZDVmMGMzOGM1NGM5YjFjNzIwM2Q3YSJ9fX0= - Skull texture
      #owner: Next - Skull owner
    previous-page:
      name: "{#4d548a}← Previous Page"
      material: BARRIER
      custom-model-data: 1
      data: 0
      lore:
        - "&7Go to previous page."
      slot: 48
      amount: 1
      glowing: false
      commands:
      - "[sound] BLOCK_NOTE_BLOCK_HAT"
    refresh:
      name: "{#4d548a}🔄 Refresh"
      material: AIR
      data: 0
      lore:
        - "&7Refresh all items."
      slot: 49
      amount: 1
      glowing: false
      commands:
      - "[sound] BLOCK_NOTE_BLOCK_HAT"
      cooldown: 3
      commands:
      - "[sound] BLOCK_NOTE_BLOCK_HAT"
    category:
      # If you have enabled the category GUI then this item wil appear into the main GUI.
      name: "{#4d548a}ⓘ Category menu"
      material: AIR
      data: 0
      lore:
        - "&eClick&b to go back to the category menu."
      slot: 45
      amount: 1
      glowing: false
      commands:
      - "[sound] BLOCK_NOTE_BLOCK_HAT"
    category-swapper:
      # If you have enabled the category GUI then this item wil appear into the main GUI.
      name: "{#4d548a}ⓘ Switch Category"
      material: BARRIER
      custom-model-data: 1
      data: 0
      lore:
        - "%categories%"
      slot: 53
      amount: 1
      glowing: false
      commands:
      - "[sound] BLOCK_NOTE_BLOCK_HAT"
      current-category: "&9→  %category%"
      other-category: "&f   %category%"
    sort:
      name: "{#4d548a}☰ Switch Sort Type"
      material: BARRIER
      custom-model-data: 1
      data: 0
      lore:
        - "&9→ &f%sort%"
      slot: 52
      amount: 1
      glowing: false
      commands:
      - "[sound] BLOCK_NOTE_BLOCK_HAT"
    menu:
      name: "{#4babde}Switch To {#ccedff}Listings"
      material: "BOOK"
      custom-model-data: 73
      data: 0
      lore:
      - "{#e3e3e3}See listings from all"
      - "{#e3e3e3}players."
      - ""
      - "&fꂀ {#83ca16}Switch."
      slot: 45
      amount: 1
      glowing: false
    myauctions:
      name: "{#4babde}Switch To {#ccedff}Your Auctions"
      material: "BOOK"
      custom-model-data: 76
      data: 0
      lore:
      - "{#e3e3e3}See listings that you"
      - "{#e3e3e3}listed."
      slot: 46
      amount: 1
      glowing: false
    expired:
      name: "{#4babde}Switch To {#ccedff}Expired Auctions"
      material: "BOOK"
      custom-model-data: 77
      data: 0
      lore:
      - "{#e3e3e3}See own listings that have"
      - "{#e3e3e3}expired."
      - ""
      - "&fꂀ {#83ca16}Switch."
      slot: 47
      amount: 1
      glowing: false

  items: []