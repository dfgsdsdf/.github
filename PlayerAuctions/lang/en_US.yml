  chat-wait-cancelled: "&fꀓ {#e55039}Cancelled your request!"
  friendly-max-auctions: "Unlimited" # If you want it to show the actual amount, use %amount%
  prefix: "" # Use to add the prefix to any message!
  auction-confirmation: "&fꀒ {#04d42c}Selling &f%item_displayname% x%amount%{#04d42c} for &6%price%{#04d42c} will cost you &e%cost%{#04d42c}, do the command again to confirm."
  auction-sell: "&fꀒ {#04d42c}Started to sell &e%item_displayname% x%amount%{#04d42c} for &6%price%{#04d42c} on the auction!"
  auction-added: "&fꀒ {#04d42c}You added &e%amount%{#04d42c} items to your similar auction on the market, the total price for that item is now &6%price%{#04d42c}, this works out as &e$%priceper%{#04d42c} per item."
  auction-bid: "&fꀒ {#04d42c}Started to bid the item for &6%price%{#04d42c} on the auction!"
  reloaded: "&fꀒ {#04d42c}Successfully reloaded all configs!"
  money-taken: "&fꀒ {#04d42c}%price% has been taken from your bank account."
  auctions-cancelled: "&fꀒ {#04d42c}Your auctions have been cancelled!"
  auctions-collected: "&fꀒ {#04d42c}Successfully collected &e%items%{#04d42c} expired items!"
  bought-item: "&fꀒ {#04d42c}Successfully purchased &e%item%{#04d42c} for &6%price%{#04d42c}!"
  someone-purchased: "&e%player%{#04d42c} has just purchased &e%item% x%amount%{#04d42c} for &6%price%{#04d42c}!"
  offline-title: "&8While you were offline..."
  bidder: "&fꀒ &e%player%{#04d42c} has just offered your bid of &e%item%{#04d42c} for &6%price%"
  bidded: "&fꀒ {#04d42c}You just offered a bid to &e%item%{#04d42c} for &6%price%"
  bid-success: "&fꀒ &e%player%{#04d42c} has won your auction of &e%item%{#04d42c} for &6%price%"
  bidder-success: "&fꀒ {#04d42c}You've won the auction of &e%item%{#04d42c} for &6%price%{#04d42c} Check your expired auctions."
  earned-offline: "&fꀒ {#04d42c}You've earned a total of &e$%total%{#04d42c}!"
  given-more-auctions-success: "&fꀒ {#04d42c}Successfully given &e%player%{#04d42c} an extra of &e%extra%{#04d42c} auctions and a total of &e%total%{#04d42c}!"
  dbexec-successful: "&fꀒ {#04d42c}Successfully updated &d%count%{#04d42c} rows. {#04d42c}Please execute &d/%cmd% reload{#04d42c} to update changes."
  current-amount-of-auctions:
    - "&fꀷ {#4b56b4}You currently have a maximum of &e%auctionsmax%{#4b56b4} &8(%staticauctions% static){#4b56b4} auctions."
    - "&fꀷ {#4b56b4}You currently have used &e%auctionsused%{#4b56b4} auctions."
  current-amount-of-auctions-other:
    - "&d%player%&b currently has a maximum of &e%auctionsmax%&b (&e%staticauctions% static&b) auctions."
    - "&d%player%&b currently has used &e%auctionsused%&b auctions."
  amount-auctions-others-alert: "&fꀓ {#e55039}%player% is currently offline, only showing their maximum auctions as a static amount."

  # the help menu for a player
  # The variable %cmd% is any command from the config.yml :)
  help-player:
    - "&7&l&m----------&7&l[ &b&lPlayer Auctions &7&l]&m----------"
    - "&e/%cmd% help &7&l- &bDisplays this menu."
    - "&e/%cmd% sell <price> [currency] [amount] &7&l- &bSell an item."
    - "&e/%cmd% bid <price> &7&l- &bBid an item."
    - "&e/%cmd% auction &7&l- &bAuction via a GUI."
    - "&e/%cmd% cancel [id] [player] &7&l- &bCancel your auctioning items."
    - "&e/%cmd% collect &7&l- &bCollect your cancelled items."
    - "&e/%cmd% open [menu] [options] &7&l- &bOpens the player auction gui."
    - "&e/%cmd% amount &7&l- &bCheck how much auctions you have."
    - "&e/%cmd% reload &7&l- &bReloads all the config files."
    - "&7&l&m----------&7&l[ &b&lPlayer Auctions &7&l]&m----------"

  # the help menu for console
  # The variable %cmd% is any command from the config.yml :)
  help-console:
    - "&7&l&m----------&7&l[ &b&lPlayer Auctions &7&l]&m----------"
    - "&e/%cmd% help &7&l- &bDisplays this menu."
    - "&e/%cmd% open [menu] [options] &7&l- &bOpens the player auction gui."
    - "&e/%cmd% reload &7&l- &bReloads all the config files."
    - "&e/%cmd% dbexec <query> &7&l- &bExecutes a query."
    - "&7&l&m----------&7&l[ &b&lPlayer Auctions &7&l]&m----------"

  # error messages.
  errors:
