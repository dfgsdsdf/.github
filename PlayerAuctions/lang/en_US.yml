    not-a-number: "&fꀓ {#e55039}That is not a number!"
    no-permission: "&fꀓ {#e55039}You do not have &4%permission%{#e55039} to do this! %reason%"
    auction-dont-exist: "&fꀓ {#e55039}That auction does not exist!"
    too-many-auctions: "&fꀓ {#e55039}You cannot sell this many items you can only sell &4%amount%{#e55039} due to your permissions/static amount!"
    money-not-enough-sell: "&fꀓ {#e55039}You do not have %price% to sell this item!"
    money-not-enough-buy: "&fꀓ {#e55039}You do not have %price% to buy this item!"
    money-not-enough-bid: "&fꀓ {#e55039}You do not have %price% to bid this item!"
    disabled-world-sell: "&fꀓ {#e55039}You cannot sell items in this world!"
    invalid-item: "&fꀓ {#e55039}That is an invalid item to sell!"
    damaged-item: "&fꀓ {#e55039}You cannot sell a damaged item!"
    invalid-gamemode: "&fꀓ {#e55039}That is an invalid gamemode to sell in!"
    invalid-category: "&fꀓ {#e55039}That is a invalid category"
    min-price: "&fꀓ {#e55039}You need to set the price to at least %min%!"
    max-price: "&fꀓ {#e55039}You need to set the price below %max%!"
    no-auctions: "&fꀓ {#e55039}You currently have no auctions!"
    no-expired-auctions: "&fꀓ {#e55039}You currently have no expired auctions to collect!"
    purchase-own: "&fꀓ {#e55039}You cannot purchase your own auction!"
    bid-own: "&fꀓ {#e55039}You cannot bid your own auction!"
    sell-cooldown: "&fꀓ {#e55039}You currently have a cooldown for auctioning items! (%cooldown% left)"
    bid-cooldown: "&fꀓ {#e55039}You currently have a cooldown for bidding items! (%cooldown% left)"
    offer-cooldown: "&fꀓ {#e55039}You currently have a cooldown for offering a bid! (%cooldown% left)"
    purchase-cooldown: "&fꀓ {#e55039}You currently have a cooldown for purchasing items! (%cooldown% left)"
    no-player-joined: "&fꀓ {#e55039}That player does not exist!"
    bidder-no-money: "&fꀓ {#e55039}%player% doesn't have enough money for your &e%item%, their offer has been removed."
    bid-no-money: "&fꀓ {#e55039}You do not have enough money anymore for &e%item%'s bid, your offer has been removed."
    min-bid: "&fꀓ {#e55039}You cannot offer that much! The minimum offer you can bid on is $1,000"
    gui-cooldown: "&fꀓ {#e55039}You will need to wait a few seconds to use this again."
    not-enough-add-bid: "&fꀓ {#e55039}You do not have enough money to add $%amount% to $%bid%"
    cancel-bid: "&fꀓ {#e55039}You cannot cancel this auction while its been offered a bid!"
    auction-doesnt-exist: "&fꀓ {#e55039}That auction doesn't exist anymore!"
    dbexec-failed: "&fꀓ {#e55039}There was an error executing this query. %error%"

