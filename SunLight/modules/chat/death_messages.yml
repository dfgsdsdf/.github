# Sets the range for death messages broadcast.
# Set to 0 for a world-wide messages.
# Set to -1 for a server-wide messages.
# Set other value for blocks distance.
Range: 0
By_DamageType:
  cactus:
    Messages:
    - <dark_gray><lred>☠</lred> <lred>%player_display_name%</lred> tried to obtain some water from cactus.</dark_gray>
    - <dark_gray><lred>☠</lred> <lred>%player_display_name%</lred> died when accidiently touch a cactus.</dark_gray>
  arrow:
    Messages:
    - <dark_gray><lred>☠</lred> <lred>%player_display_name%</lred> was shot by a <lred>%source%</lred>.</dark_gray>
  drown:
