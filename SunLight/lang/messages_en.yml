Command:
  Argument:
    Name:
      Slot: slot
      Enchant: enchant
      Level: level
      Target: target
      Type: type
      Time: time
      Mode: mode
      IPAddress: address
      Radius: radius
      Text: text
      Position: position
      X: x
      Y: y
      Z: z
      Reason: reason
      IPorName: name | address
  Air:
    Add:
      Desc: Add air ticks.
    Set:
      Desc: Set air ticks.
      Target: '<systemgreen>Set <lyellow>%amount%</lyellow> air ticks for <lyellow>%player_display_name%</lyellow>. New air ticks: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</systemgreen>'
      Notify:
      - <output:"action_bar">
      - '<systemgreen>Your air ticks set to <lyellow>%amount%</lyellow>: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</systemgreen>'
    Remove:
      Desc: Remove air ticks.
    Give:
      Target: '<systemgreen>Added <lyellow>%amount%</lyellow> air ticks to <lyellow>%player_display_name%</lyellow>. New air ticks: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</systemgreen>'
      Notify:
      - <output:"action_bar">
      - '<systemgreen>You got <lyellow>%amount%</lyellow> air ticks: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</systemgreen>'
    Take:
      Target: '<systemgreen>Removed <lyellow>%amount%</lyellow> air ticks from <lyellow>%player_display_name%</lyellow>. New air ticks: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</systemgreen>'
      Notify:
      - <output:"action_bar">
      - '<systemgreen>You lost <lyellow>%amount%</lyellow> air ticks: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</systemgreen>'
  Anvil:
    Desc: Open portable anvil.
    Target: <white>ꀒ <systemgreen>Opened portable anvil for <lyellow>%player_display_name%</lyellow>.</systemgreen>
    Notify:
    - <output:"action_bar">
    - <white>ꀒ <systemgreen>You opened portable anvil.</systemgreen>
  Broadcast:
    Desc: Broadcast a message.
  Condense:
    Desc: Condense items into blocks.
    Error:
      Nothing:
      - <sound:"entity_villager_no">
      - <white>ꀓ <systemred>Nothing to condense.</systemred>
      NotEnough: <white>ꀓ <systemred>Not enough items to convert <systemred>%source%</systemred> to <systemred>%result%</systemred>. Need at least <systemred>%amount%</systemred>.</systemred>
    Done: <white>ꀒ <systemgreen>Converted <lyellow>x%total% %source%</lyellow> to <lyellow>x%amount% %result%</lyellow>.</systemgreen>
  Disposal:
    Desc: Open a disposal menu.
    Target: <white>ꀒ <systemgreen>Opened disposal for <lyellow>%player_display_name%</lyellow>.</systemgreen>
    Notify:
    - <output:"action_bar"><sound:"block_chest_open">
    - <white>ꀒ <systemgreen>You opened disposal.</systemgreen>
  Dimension:
    Desc: Teleport to a world.
    Target: <white>ꀒ <systemgreen>Teleported <lyellow>%player_display_name%</lyellow> to the <lyellow>%world%</lyellow>.</systemgreen>
    Notify:
    - <output:"action_bar"><sound:"entity_enderman_teleport">
    - <white>ꀒ <systemgreen>You travelled to the <lyellow>%world%</lyellow>.</systemgreen>
  Enchant:
    Desc: (Dis)Enchant item in a slot.
    Error:
      NoItem: <white>ꀓ <systemred>No item to enchant!</systemred>
    Enchanted:
      Target:
      - <sound:"block_enchantment_table_use">
      - <white>ꀒ <systemgreen>Enchanted <lyellow>%item%</lyellow> with <lyellow>%name% %amount%</lyellow> in <lyellow>%player_display_name%</lyellow>'s <lyellow>%type%</lyellow> slot!</systemgreen>
      Notify:
      - <sound:"block_enchantment_table_use">
      - <white>ꀒ <systemgreen>Your <lyellow>%item%</lyellow> have been enchanted with <lyellow>%name% %amount%</lyellow>!</systemgreen>
    Disenchanted:
      Target:
      - <sound:"block_grindstone_use">
      - <white>ꀒ <systemgreen>Enchantment <lyellow>%name%</lyellow> have been removed from <lyellow>%item%</lyellow> in <lyellow>%player_display_name%</lyellow>'s <lyellow>%type%</lyellow> slot.</systemgreen>
      Notify:
      - <sound:"block_grindstone_use">
      - <white>ꀒ <systemgreen>Your <lyellow>%item%</lyellow> have been disenchanted from <lyellow>%name%</lyellow>!</systemgreen>
  Enchanting:
    Desc: Open portable enchanting table.
    Notify:
    - <output:"action_bar">
    - <white>ꀒ <systemgreen>You opened enchanting table.</systemgreen>
    Target: <white>ꀒ <systemgreen>Opened enchanting table for <lyellow>%player_display_name%</lyellow>.</systemgreen>
  Experience:
    Add:
      Desc: Add xp points or levels.
      Info:
      - <noprefix>
      - ' '
      - <white>ꀒ <systemgreen>Added <lyellow>%amount%</lyellow> %type% to <lyellow>%player_display_name%</lyellow>.</systemgreen>
      - '<systemgreen>New level: <lyellow>%level%</lyellow></systemgreen>'
      - '<systemgreen>Total experience: <lyellow>%total%</lyellow></systemgreen>'
      - ' '
      Notify:
      - <noprefix>
      - ' '
      - <white>ꀒ <systemgreen><lyellow>%amount%</lyellow> %type% have been added to your experience!</systemgreen>
      - '<systemgreen>New level: <lyellow>%level%</lyellow></systemgreen>'
      - '<systemgreen>Total experience: <lyellow>%total%</lyellow></systemgreen>'
      - ' '
    Remove:
      Desc: Remove xp points or levels.
      Info:
      - <noprefix>
      - ' '
      - <white>ꀒ <systemgreen>Removed <lyellow>%amount%</lyellow> %type% off <lyellow>%player_display_name%</lyellow>.</systemgreen>
      - '<systemgreen>New level: <lyellow>%level%</lyellow></systemgreen>'
      - '<systemgreen>Total experience: <lyellow>%total%</lyellow></systemgreen>'
      - ' '
      Notify:
      - <noprefix>
      - ' '
      - <white>ꀒ <systemgreen><lyellow>%amount%</lyellow> %type% have been removed off your experience!</systemgreen>
      - '<systemgreen>New level: <lyellow>%level%</lyellow></systemgreen>'
      - '<systemgreen>Total experience: <lyellow>%total%</lyellow></systemgreen>'
      - ' '
    Set:
      Desc: Set xp points or levels.
      Info:
      - <noprefix>
      - ' '
      - <white>ꀒ <systemgreen>Set <lyellow>%amount%</lyellow> %type% for <lyellow>%player_display_name%</lyellow>.</systemgreen>
      - '<systemgreen>New level: <lyellow>%level%</lyellow></systemgreen>'
      - '<systemgreen>Total experience: <lyellow>%total%</lyellow></systemgreen>'
      - ' '
      Notify:
      - <noprefix>
      - ' '
      - <white>ꀒ <systemgreen><lyellow>%amount%</lyellow> %type% have been set as your experience!</systemgreen>
      - '<systemgreen>New level: <lyellow>%level%</lyellow></systemgreen>'
      - '<systemgreen>Total experience: <lyellow>%total%</lyellow></systemgreen>'
      - ' '
    View:
      Desc: View experience status.
    Info:
      Info:
      - <noprefix>
      - ' '
      - <lyellow><b>Experience of %player_display_name%:</b></lyellow>
      - '<systemgreen>Level: <lyellow>%level%</lyellow></systemgreen>'
      - '<systemgreen>Total experience: <lyellow>%total%</lyellow></systemgreen>'
      - '<systemgreen>To next level: <lyellow>%max%</lyellow></systemgreen>'
      - ' '
  Enderchest:
    Clear:
      Desc: Clear ender chest.
      Done:
        Target:
        - <sound:"block_fire_extinguish">
        - <white>ꀒ <systemgreen>Cleared <lyellow>%player_display_name%</lyellow>'s ender chest!</systemgreen>
        Notify:
        - <sound:"block_fire_extinguish">
        - <white>ꀒ <systemgreen>Your ender chest has been cleared!</systemgreen>
    Copy:
      Desc: Copy player's ender chest.
      Done:
        Executor:
        - <sound:"item_armor_equip_leather">
        - <white>ꀒ <systemgreen>Copied <lyellow>%player_display_name%</lyellow>'s ender chest.</systemgreen>
        Others:
        - <sound:"item_armor_equip_leather">
        - <white>ꀒ <systemgreen>Copied <lyellow>%source%</lyellow>'s ender chest content to <lyellow>%target%</lyellow>'s ender chest.</systemgreen>
    Fill:
      Desc: Fill ender chest with specified item.
      Done:
        Executor:
        - <sound:"entity_item_pickup">
        - <white>ꀒ <systemgreen>Filled <lyellow>%player_display_name%</lyellow>'s ender chest with <lyellow>%item%</lyellow>.</systemgreen>
    Open:
      Desc: Open ender chest.
      Done:
        Executor:
        - <sound:"block_ender_chest_open">
        - <white>ꀒ <systemgreen>Opened <lyellow>%player_display_name%</lyellow>'s ender chest.</systemgreen>
    Repair:
      Desc: Repair all ender chest items.
      Notify:
      - <sound:"block_anvil_use">
      - <white>ꀒ <systemgreen>Repaired all ender chest items!</systemgreen>
      Target:
      - <sound:"block_anvil_use">
      - <white>ꀒ <systemgreen>Repaired all items in <lyellow>%player_display_name%</lyellow>'s ender chest!</systemgreen>
  Hat:
    Desc: Put item in head.
    Done:
    - <sound:"item_armor_equip_leather">
    - <white>ꀒ <systemgreen>Enjoy your new hat!</systemgreen>
  Fly:
    Desc: Toggle fly.
    Target: <white>ꀒ <systemgreen>Set flying for <lyellow>%player_display_name%</lyellow> to <lyellow>%state%</lyellow>.</systemgreen>
    Notify: <white>ꀒ <systemgreen>Flying <lyellow>%state%</lyellow>.</systemgreen>
  FlySpeed:
    Desc: Change fly speed.
    Done:
      Notify: <white>ꀒ <systemgreen>Your fly speed has been set to <lyellow>%amount%</lyellow>.</systemgreen>
      Target: <white>ꀒ <systemgreen>Set fly speed to <lyellow>%amount%</lyellow> for <lyellow>%player_display_name%</lyellow>.</systemgreen>
  Fire:
    Set:
      Desc: Set fire ticks.
      Info: '<systemgreen>Set <lyellow>%player_display_name%</lyellow>''s fire ticks to <lyellow>%amount%</lyellow>, aka ignited for: <lyellow>%time%</lyellow>s.</systemgreen>'
      Target: <white>ꀒ <systemgreen>You have been ignited for <lyellow>%time%</lyellow>s.</systemgreen>
    Reset:
      Desc: Reset fire ticks.
      Info:
      - <sound:"block_fire_extinguish">
      - <white>ꀒ <systemgreen>Reset <lyellow>%player_display_name%</lyellow>'s fire ticks value, aka extinguished.</systemgreen>
      Target:
      - <sound:"block_fire_extinguish">
      - <white>ꀒ <systemgreen>You have been extinguished.</systemgreen>
  Food:
    Add:
      Desc: Add food points.
    Set:
      Desc: Set food level.
      Target: <white>ꀒ <systemgreen>Set <lyellow>%player_display_name%</lyellow>'s food level to <lyellow>%amount%</lyellow>.</systemgreen>
      Notify: <white>ꀒ <systemgreen>Your food level has been set to <lyellow>%amount%</lyellow>.</systemgreen>
    Remove:
      Desc: Remove food points.
    Restore:
      Desc: Restore food level.
      Notify:
      - <sound:"entity_generic_eat">
      - <white>ꀒ <systemgreen>You food level has been restored!</systemgreen>
      Info:
      - <sound:"entity_generic_eat">
      - <white>ꀒ <systemgreen>Restored <lyellow>%player_display_name%</lyellow>'s food level!</systemgreen>
    Give:
      Target: '<systemgreen>Added <lyellow>%amount%</lyellow> food points to <lyellow>%player_display_name%</lyellow>. New food level: <lyellow>%current%</lyellow>.</systemgreen>'
      Notify: <white>ꀒ <systemgreen>Your food level has been increased by <lyellow>%amount%</lyellow>.</systemgreen>
    Take:
      Target: '<systemgreen>Removed <lyellow>%amount%</lyellow> food points from <lyellow>%player_display_name%</lyellow>. New food level: <lyellow>%current%</lyellow>.</systemgreen>'
      Notify: <white>ꀒ <systemgreen>Your food level has been decreased by <lyellow>%amount%</lyellow>.</systemgreen>
  Grindstone:
    Desc: Open portable grindstone.
    Notify:
    - <output:"action_bar">
    - <white>ꀒ <systemgreen>You opened grindstone.</systemgreen>
    Target: <white>ꀒ <systemgreen>Opened grindstone for <lyellow>%player_display_name%</lyellow>.</systemgreen>
  GameMode:
    Type:
      Desc: Set gamemode to %type%.
    Notify: <white>ꀒ <systemgreen>Your game mode has been set to <lyellow>%type%</lyellow>.</systemgreen>
    Target: <white>ꀒ <systemgreen>Set <lyellow>%type%</lyellow> game mode for <lyellow>%player_display_name%</lyellow>.</systemgreen>
  Health:
    Add:
      Desc: Add health points.
      Target: '<systemgreen>Added <lyellow>%amount%</lyellow> health to <lyellow>%player_display_name%</lyellow>. New health: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</systemgreen>'
      Notify:
      - <output:"action_bar">
      - '<systemgreen>You got <lyellow>%amount%</lyellow> health: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</systemgreen>'
    Set:
      Desc: Set health points.
      Target: '<systemgreen>Set <lyellow>%amount%</lyellow> health for <lyellow>%player_display_name%</lyellow>. New health: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</systemgreen>'
      Notify:
      - <output:"action_bar">
      - <white>ꀒ <systemgreen>Your health has been set to <lyellow>%amount%</lyellow>/<lyellow>%max%</lyellow>.</systemgreen>
    Remove:
      Desc: Remove health points.
      Target: '<systemgreen>Removed <lyellow>%amount%</lyellow> health from <lyellow>%player_display_name%</lyellow>. New health: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</systemgreen>'
      Notify:
      - <output:"action_bar">
      - '<systemgreen>You lost <lyellow>%amount%</lyellow> health: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</systemgreen>'
    Restore:
      Desc: Restore health.
      Notfiy: <white>ꀒ <systemgreen>You have been healed!</systemgreen>
      Info: <white>ꀒ <systemgreen>Player <lyellow>%player_display_name%</lyellow> has been healed.</systemgreen>
  Ignore:
    Add:
      Desc: Add player to the blacklist.
      Done:
      - <noprefix>
      - <lyellow><b>Player Blocked!</b></lyellow>
      - <white>ꀒ <systemgreen>Player <lyellow>%player_display_name%</lyellow> added to the blacklist.</systemgreen>
      - <white>ꀒ <systemgreen>You can change settings or unblock them using <lyellow>/ignorelist</lyellow></systemgreen>
      Error:
        AlreadyIn: <white>ꀓ <systemred>Player is already blocked.</systemred>
    List:
      Desc: Open player blacklist.
    Remove:
      Desc: Remove player from the blacklist.
      Done: <white>ꀒ <systemgreen>Player <lyellow>%player_name%</lyellow> has been unblocked.</systemgreen>
      Error:
        NotIn: <white>ꀓ <systemred>Player is not blocked.</systemred>
  Inventory:
    Clear:
      Desc: Clear inventory.
      Done:
        Target:
        - <sound:"block_fire_extinguish">
        - <white>ꀒ <systemgreen>Cleared <lyellow>%player_display_name%</lyellow>'s inventory!</systemgreen>
        Notify:
        - <sound:"block_fire_extinguish">
        - <white>ꀒ <systemgreen>Your inventory has been cleared!</systemgreen>
    Copy:
      Desc: Copy player's inventory.
      Done:
        Notify:
        - <sound:"item_armor_equip_leather">
        - <white>ꀒ <systemgreen>Copied <lyellow>%player_display_name%</lyellow>'s inventory.</systemgreen>
        Target:
        - <sound:"item_armor_equip_leather">
        - <white>ꀒ <systemgreen>Copied <lyellow>%source%</lyellow>'s inventory to <lyellow>%target%</lyellow>'s inventory.</systemgreen>
    Fill:
      Desc: Fill inventory with specified items.
      Done:
      - <sound:"entity_item_pickup">
      - <white>ꀒ <systemgreen>Filled <lyellow>%player_display_name%</lyellow>'s inventory with <lyellow>%item%</lyellow>.</systemgreen>
    Open:
      Desc: Open player's inventory.
      Done:
      - <sound:"block_chest_open">
      - <white>ꀒ <systemgreen>Opened <lyellow>%player_display_name%</lyellow>'s inventory.</systemgreen>
    Repair:
      Desc: Repair all inventory items.
      Notify:
      - <sound:"block_anvil_use">
      - <white>ꀒ <systemgreen>Repaired all inventory items!</systemgreen>
      Target:
      - <sound:"block_anvil_use">
      - <white>ꀒ <systemgreen>Repaired all items in <lyellow>%player_display_name%</lyellow>'s inventory!</systemgreen>
  Item:
    Amount:
      Desc: Change item amount.
      Done:
      - <sound:"entity_item_pickup">
      - <white>ꀒ <systemgreen>Set <lyellow>%item%</lyellow> stack amount to x<lyellow>%amount%</lyellow>.</systemgreen>
    Damage:
      Desc: Change item's damage.
      Done:
      - <sound:"block_anvil_use">
      - <white>ꀒ <systemgreen>Set <lyellow>%item%</lyellow> damage to <lyellow>%amount%</lyellow>.</systemgreen>
    Enchant:
      Desc: (Dis)Enchant an item in hand.
      Done:
        Enchanted:
        - <sound:"block_enchantment_table_use">
        - <white>ꀒ <systemgreen><lyellow>%item%</lyellow> enchanted with <lyellow>%name% %level%</lyellow>!</systemgreen>
        Disenchanted:
        - <sound:"block_enchantment_table_use">
        - <white>ꀒ <systemgreen>Enchantment <lyellow>%name%</lyellow> have been removed from <lyellow>%item%</lyellow>!</systemgreen>
    Get:
      Desc: Get specified item stack.
      Done:
      - <sound:"entity_item_pickup">
      - <white>ꀒ <systemgreen>You got <lyellow>x%amount% %type%</lyellow>!</systemgreen>
    Give:
      Desc: Give specified item stack to a player.
      Done:
      - <sound:"entity_item_pickup">
      - <white>ꀒ <systemgreen>Added <lyellow>x%amount% %type%</lyellow> to <lyellow>%player_display_name%</lyellow>!</systemgreen>
      Notify:
      - <sound:"entity_item_pickup">
      - <white>ꀒ <systemgreen><lyellow>x%amount% %type%</lyellow> have been added to your inventory!</systemgreen>
    Take:
      Desc: Take item off a player.
      Done:
      - <sound:"entity_glow_item_frame_remove_item">
      - <white>ꀒ <systemgreen>Removed <lyellow>x%amount%</lyellow> of <lyellow>%type%</lyellow> from <lyellow>%player_display_name%</lyellow>!</systemgreen>
      Error:
        NotEnough:
        - <sound:"entity_villager_no">
        - <white>ꀓ <systemred>Could not take item(s). Player don't have enough <systemred>%type%</systemred> (<white>%amount%</white>/<white>%total%</white>)!</systemred>
      Notify:
      - <sound:"entity_glow_item_frame_remove_item">
      - <white>ꀒ <systemgreen><lyellow>x%amount%</lyellow> of <lyellow>%type%</lyellow> has been taken from your inventory!</systemgreen>
    Lore:
      Add:
        Desc: Add a lore.
        Done:
        - <sound:"block_anvil_use">
        - <white>ꀒ <systemgreen>Lore added!</systemgreen>
      Remove:
        Desc: Remove a lore.
        Done:
        - <sound:"block_anvil_use">
        - <white>ꀒ <systemgreen>Lore removed!</systemgreen>
      Clear:
        Desc: Clear lore.
        Done:
        - <sound:"block_anvil_use">
        - <white>ꀒ <systemgreen>Lore cleared!</systemgreen>
    Model:
      Desc: Change item model data.
      Done:
      - <sound:"block_anvil_use">
      - <white>ꀒ <systemgreen>Set <lyellow>%amount%</lyellow> as <lyellow>%item%</lyellow>'s model data!</systemgreen>
    Name:
      Desc: Change item display name.
      Done:
        Changed:
        - <sound:"block_anvil_use">
        - <white>ꀒ <systemgreen>Item renamed!</systemgreen>
    Potion:
      Add:
        Desc: Add effect to a potion.
        Done: <white>ꀒ <systemgreen>Potion effect added!</systemgreen>
    Repair:
      Desc: Repair item.
      Done:
      - <sound:"block_anvil_use">
      - <white>ꀒ <systemgreen>Item <lyellow>%item%</lyellow> repaired!</systemgreen>
    Spawn:
      Desc: Spawn item in world.
      Done:
      - <sound:"entity_item_pickup">
      - <white>ꀒ <systemgreen>Spawned <lyellow>x%amount%</lyellow> <lyellow>%type%</lyellow> at <lyellow>%location_x%, %location_y%, %location_z%</lyellow> in <lyellow>%location_world%</lyellow>!</systemgreen>
    Unbreakable:
      Desc: Toggle unbreakable state.
      Done:
      - <sound:"block_anvil_use">
      - '<systemgreen>Set <lyellow>%item%</lyellow> Unbreakable: <lyellow>%state%</lyellow>.</systemgreen>'
  Loom:
    Desc: Open portable loom.
    Notify:
    - <output:"action_bar">
    - <white>ꀒ <systemgreen>You opened loom.</systemgreen>
    Target: <white>ꀒ <systemgreen>Opened loom for <lyellow>%player_display_name%</lyellow>.</systemgreen>
  Mob:
    Kill:
      Desc: Kill specific mob.
      Done:
      - <sound:"entity_zombie_death">
      - <white>ꀒ <systemgreen>Killed <lyellow>x%amount% %type%</lyellow> in <lyellow>%world%</lyellow> within <lyellow>%radius%</lyellow> blocks.</systemgreen>
    Clear:
      Desc: Kill all mobs.
      Done:
      - <sound:"entity_zombie_death">
      - <white>ꀒ <systemgreen>Killed <lyellow>%amount%</lyellow> mobs in <lyellow>%world%</lyellow> within <lyellow>%radius%</lyellow> blocks.</systemgreen>
    Spawn:
      Desc: Spawn a mob.
      Done: <white>ꀒ <systemgreen>Created <lyellow>x%amount% %type%</lyellow>.</systemgreen>
  Near:
    Desc: Show nearest players.
    Error:
      Nothing: <white>ꀓ <systemred>There are no players in a <lyellow>%radius%</lyellow> block radius.</systemred>
  Nick:
    Clear:
      Desc: Remove custom name.
      Target: <white>ꀒ <systemgreen>Removed <lyellow>%player_display_name%</lyellow>'s custom name.</systemgreen>
      Notify: <white>ꀒ <systemgreen>You custom name has been removed.</systemgreen>
    Set:
      Desc: Set player's custom name.
      Target: <white>ꀒ <systemgreen>Set <lyellow>%player_name%</lyellow>'s custom name to <lyellow>%name%</lyellow>.</systemgreen>
      Notify: '<systemgreen>You got a new custom name: <lyellow>%name%</lyellow>.</systemgreen>'
    Change:
      Desc: Set custom name.
      Done: <white>ꀒ <systemgreen>You changed your custom name to <lyellow>%name%</lyellow>.</systemgreen>
    Error:
      BadWords: <white>ꀓ <systemred>This name is not allowed.</systemred>
      Regex: <white>ꀓ <systemred>Name contains forbidden characters.</systemred>
      TooLong: <white>ꀓ <systemred>Name can't be no longer than <systemred>%amount%</systemred> characters.</systemred>
      TooShort: <white>ꀓ <systemred>Name can't be shorted than <systemred>%amount%</systemred> characters.</systemred>
  PlayerInfo:
    Desc: Show player info.
  Skull:
    Custom:
      Desc: Create custom head.
      Done: <white>ꀒ <systemgreen>Created custom head.</systemgreen>
    Player:
      Desc: Get player head.
      Done: <white>ꀒ <systemgreen>You got <lyellow>%player_name%</lyellow>'s head.</systemgreen>
  Staff:
    Desc: Show online staff.
    Empty: <white>ꀒ <systemgreen>There is no staff online.</systemgreen>
  Spawner:
    Desc: Change spawner type.
    Done: <white>ꀒ <systemgreen>Spawner type changed to <lyellow>%type%</lyellow>.</systemgreen>
    Error:
      Type: <white>ꀓ <systemred>This type can not be set for spawner.</systemred>
      Block: <white>ꀓ <systemred>You must look at Spawner block!</systemred>
  Speed:
    Desc: Change walk speed.
    Done:
      Notify: <white>ꀒ <systemgreen>Your walk speed has been set to <lyellow>%amount%</lyellow>.</systemgreen>
      Target: <white>ꀒ <systemgreen>Set walk speed to <lyellow>%amount%</lyellow> for <lyellow>%player_display_name%</lyellow>Tag{name='lyellow'}.</systemgreen>
  Sudo:
    Command:
      Desc: Force player to execute a command.
    Chat:
      Desc: Force player to send a chat message.
