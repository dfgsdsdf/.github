# Sets whether or not commands with similar names/aliases should be unregistered from the server
# if they're overlaps with the SunLight commands.
# Warning: Setting this on 'true' may result both positive and negative effects.
Unregister_Conflicts: false
Cooldowns:
  heal:
    Commands: heal,health
    Patterns:
    - heal
    - hp|health restore
    Cooldown:
      vip: 60
      gold: 30
  home:
    Commands: homes,home
    Patterns:
    - homes teleport
    - home
    Cooldown:
      vip: 0
      default: 30
Settings:
  Time:
    # In this section you can create custom shortcuts for the 'time_set' command.
    # In other words, it will create one-shot time set commands with specified name and time value.
    Shortcuts:
      midnight: 18000
      sunrise: 23000
      noon: 6000
      sunset: 12000
      night: 13000
      day: 1000
  # Add here names of command executors to disable them completely.
  # Disabled executor will result in disabling ALL commands using that executor.
  Disabled_Executors: []
  Broadcast:
    # Sets message format for the 'broadcast' command.
    # Text Formations: https://github.com/nulli0n/nightcore-spigot/wiki/Text-Formation
    Format: <newline><lyellow><b>BROADCAST:</b></lyellow><newline><lgray>%message%</lgray><newline>
  Disposal:
    Menu:
      # Sets the inventory title for disposal GUI.
      Title: <black>Disposal</black>
      # Sets the inventory size for disposal GUI. Must be multiply of 9 up to 54.
      Size: 36
  FoodLevel:
    Restore:
      # Sets whether or not 'foodlevel_restore' command will give saturation points.
      GiveSaturation: true
      # Sets amount of saturation points given by the 'foodlevel_restore' command.
      Saturation_Amount: 5.0
  Health:
    Restore:
      # Sets whether or not 'health_restore' command will clear potion effects as well.
      ClearEffects: true
  Mob:
    Spawn:
      # Sets max. possible amount for the 'mob_spawn' command.
      Limit: 10
    Clear:
      # Sets whether or not 'mob_clear' command should ignore tamed mobs.
      Ignore_Tamed: true
      # Sets whether or not 'mob_clear' command should ignore villagers.
      Ignore_Villagers: true
  Near:
    # Sets radius for the 'near' command.
    Radius: 100
    # List format for the 'near' command.
    # Use '%radius%' placeholder for command radius value.
    # Available text formations: https://github.com/nulli0n/nightcore-spigot/wiki/Text-Formation
    Format:
    - ' '
    - <lyellow><b>Nearby Players:</b></lyellow>
    - '%entry%'
    - ' '
    # Player entry format.
    # Available text formations: https://github.com/nulli0n/nightcore-spigot/wiki/Text-Formation
    # PlaceholderAPI is supported here.
    EntryFormat: <lgray><lyellow>●</lyellow> %vault_prefix%<hover:show_text:'<gray>Click to send teleport request.</gray>'><click:suggest_command:"/ptp request %player_name%">%player_display_name%</click></hover>%vault_suffix% <gray>(<white>%amount%</white> blocks away)</gray></lgray>
  Nick:
    # Sets minimal allowed length for the 'nick_change' command.'
    Min_Length: 3
    # Sets maximal allowed length for the 'nick_change' command.'
    Max_Length: 20
    # A list of words that can not be used in the 'nick_change' command.'
    Banned_Words:
    - nigga
    - dick
    - ass
    - admin
    # Sets regex pattern that custom nick must match to be used.
    # By default it accepts all EN-RU characters, numbers, spaces and underscore.
    Regex: '[a-zA-Zа-яА-Я0-9_\s]*'
  PlayerInfo:
    # Player info format.
    # PlaceholderAPI is supported here.
    # Text formations: https://github.com/nulli0n/nightcore-spigot/wiki/Text-Formation
    Format:
    - ' '
    - <lyellow><b>%player_name% Info:</b></lyellow>
    - ' '
    - '<lyellow>▪ <lgray>Real Name: </lgray>%player_name%</lyellow>'
    - '<lyellow>▪ <lgray>Display Name: </lgray>%player_display_name%</lyellow>'
    - '<lyellow>▪ <lgray>Online: </lgray>%is_online%</lyellow>'
    - '<lyellow>▪ <lgray>Last Join: </lgray>%last_join%</lyellow>'
    - '<lyellow>▪ <lgray>Last IP: </lgray>%ip%</lyellow>'
    - ' '
    - '<lyellow>▪ <lgray>Location: </lgray>%location_x%, %location_y%, %location_z% in %location_world%</lyellow>'
    - '<lyellow>▪ <lgray>Game Mode: </lgray>%game_mode%</lyellow>'
    - '<lyellow>▪ <lgray>Can Fly: </lgray>%can_fly%</lyellow>'
    - '<lyellow>▪ <lgray>Food Level: </lgray>%food_level% <lgreen>+%saturation%</lgreen></lyellow>'
    - '<lyellow>▪ <lgray>Health: </lgray>%health%<lgray>/</lgray>%max_health%</lyellow>'
    - ' '
  Staff:
    # List of staff ranks to display players from for the 'staff' command.
    # You must have Vault with compatible permissions plugins installed.
    Ranks:
    - owner
    - admin
    - mod
    - helper
    # Staff list format.
    # Use '%entry%' placeholder for a player list.
    # Available text formations: https://github.com/nulli0n/nightcore-spigot/wiki/Text-Formation
    ListFormat:
    - ' '
    - <lyellow><b>Staff Online:</b></lyellow>
    - '%entry%'
    - ' '
    - <lgray>Total <lyellow>%amount%</lyellow> staff online.</lgray>
    - ' '
    # Player entry format.
    # Available text formations: https://github.com/nulli0n/nightcore-spigot/wiki/Text-Formation
    # PlaceholderAPI is supported here.
    EntryFormat: <lgray><lyellow>●</lyellow> %vault_prefix%<hover:show_text:'<gray>Click to send private message.</gray>'><click:suggest_command:"/msg %player_name% ">%player_display_name%</click></hover>%vault_suffix%</lgray>
  Item:
    Amount:
      # Sets default amount for the 'item_amount' command.
      Default_Value: 64
