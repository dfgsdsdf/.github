      cmd0:
        format: qadmin reroll %player_name% 1
        delay: 0.0
        console: true
      cmd1:
        format: qadmin reroll %player_name% 2
        delay: 0.0
        console: true
      cmd2:
        format: qadmin reroll %player_name% 3
        delay: 0.0
        console: true
    name: <#4e59de>♠Dice <#db4da0>♥of <#e09443>♦Fate
