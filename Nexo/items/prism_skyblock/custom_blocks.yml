cobalt_ore:
  itemname: Cobalt Ore
  material: DIAMOND
  Pack:
    parent_model: block/cube_all
    textures:
    - prism_skyblock/block_textures/cobalt_ore
    custom_model_data: 1000
  Mechanics:
    custom_block:
      block_sounds:
        place_sound: block.stone.place
        break_sound: block.stone.break
