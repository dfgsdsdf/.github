settings:
  menu: 'stardust-shop'
  buy-more: false
  shop-name: 'Drops Магазин'
  hide-message: false

general-configs:
  fail-actions:
    - 'sound: entity.villager.no;;1;;1'
  buy-actions:
    - 'sound: coins;;1;;1-b-o' 
  sell-actions:
    - 'sound: coins;;1;;1-b-o' 

items:
