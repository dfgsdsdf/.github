  Включено: false
  Material: "WHITE_STAINED_GLASS_PANE"
  Glowing: false

Настройки:
  Permission: ""

  Give-Interest-If-Not-Available: false

  # This is the item that will be showed up in the
  # banks-gui if the multiple-banks module is enabled.
  #
  # You can also use heads and placeholders.
  БанкsGuiItem:
    # The item showed in the banks gui
    # if this bank is available.
    Available:
      Material: "CHEST"
      Displayname: "&a&lBANK"
      Lore:
        - "&aYour main bank :)"
        - ""
        - "&7Банк capacity: &a%bankplus_capacity{bank}%"
        - "&7Банк level: &a%bankplus_level{bank}%"
        - "&7Банк money: &a%bankplus_balance_formatted{bank}%"
        - ""
        - "&aAvailable: &2YES"
      Glowing: true

    # The item showed in the banks gui
    # if this bank is unavailable.
    Unavailable:
      Material: "CHEST"
      Displayname: "&a&lBANK"
      Lore:
        - "&aYour main bank :)"
        - ""
        - "&7Банк capacity: &a%bankplus_capacity{bank}%"
        - "&7Банк level: &a%bankplus_level{bank}%"
        - "&7Банк money: &a%bankplus_balance_formatted{bank}%"
        - ""
        - "&aAvailable: &cNO"
        - "&aNeeded permission: &bbankplus.use"
      Glowing: true

# These are the bank levels, you can upgrade a bank
# by running the command /bank upgrade <bank> or by
# using the action in the gui "Улучшение".
#
# If the levels section isn't specified, the bank will
# have no upgrades and will use the default values set
# in the config.yml
Levels:
  1: 
    Capacity: "50000000"
    Interest: "1%"
    Offline-Interest: "1%"
    Max-Interest-Количество: 250000
  2:
    Cost: "5000000"
    Remove-Required-Items: true
    Capacity: "100000000"
    Interest: "1.5%"
    Offline-Interest: "1.5%"
    Max-Interest-Количество: 300000
  3:
    Cost: "10000000"
    Remove-Required-Items: true
    Capacity: "250000000"
    Interest: "2%"
    Offline-Interest: "2%"
    Max-Interest-Количество: 350000
  4:
    Cost: "25000000"
    Remove-Required-Items: true
    Capacity: "500000000"
    Interest: "2%"
    Offline-Interest: "2%"
    Max-Interest-Количество: 400000
  5:
    Cost: "50000000"
    Remove-Required-Items: true
    Capacity: "1000000000"
    Interest: "2%"
    Offline-Interest: "2%"
    Max-Interest-Количество: 500000

