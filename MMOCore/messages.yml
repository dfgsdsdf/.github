# PvP Mode
pvp-mode:
  cooldown: '<white>ꀓ <#e55039>Please wait {remaining} seconds to use this command again.'

  # When you cannot hit another player
  cannot-hit:
    high-level-difference: '<white>ꀓ <#e55039>Level difference is too high to fight this player.'
    low-level-target: '<white>ꀓ <#e55039>You cannot fight this player as their level is too low.'
    low-level-self: '<white>ꀓ <#e55039>Your level is too low to fight other players.'
    pvp-mode-disabled-target: '<white>ꀓ <#e55039>This player has not toggled on PvP.'
    pvp-mode-disabled-self: '<white>ꀓ <#e55039>You have not toggled on PvP.'
    invulnerable-self: '<white>ꀓ <#e55039>You are still out of combat for {left} seconds.'
    invulnerable-target: '<white>ꀓ <#e55039>This player is out of combat for {left} seconds.'

  # When using /pvpmode
  toggle:
    on-safe: '<#04d42c>You will now be able to fight other players in dedicated areas.'
    on-invulnerable: '<#04d42c>You will be able to fight other players in {time} seconds.'
    off-safe: '<white>ꀓ <#e55039>You can no longer fight other players.'

  # Entering/leaving regions
  leave:
    pvp-allowed: '<white>ꀓ <#e55039>You left a PVP zone but are still vulnerable for {remaining} seconds!'
    pvp-denied: '<white>ꀓ <#e55039>You left the PVP zone.'
  enter:
    pvp-mode-on: '<#04d42c>You entered a PVP zone and gained invulnerability for {time} seconds!'
    pvp-mode-off: '<#04d42c>You entered a PVP zone. You may use /pvpmode to fight other players.'

