INFECTED_SCIENTIST:
  Type: ZOMBIE
  Display: "&cInfected Scientist &8[&c<caster.hp{round=0}><red><&heart></red>&8]"
  Health: 40
  Armor: 5
  Damage: 4
  Disguise: player <inherit> setSkin infected_scientist setDynamicName true
  Faction: dungeon
  Options:
    AlwaysShowName: true
    Silent: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventRenaming: true
    PreventTransformation: true
    PreventConversion: true
    PreventJockeyMounts: true
  Drops:
  - mmoitems{type=MATERIAL;id=INFECTED_FLESH} 1 0.1
  Equipment:
  - leather_leggings{color=WHITE} legs
  - leather_boots{color=WHITE} boots
  - SHEARS HAND
  Skills:
  - setname{name=<caster.name>;delay=2} @self ~onDamaged
  - randomskill{skills=
      [- shootpotion{type=SLOW;duration=100;level=1;velocity=5} @target],
      [- shootpotion{type=POISON;duration=100;level=2;velocity=5} @target],
      [- shootpotion{type=WEAKNESS;duration=100;level=2;velocity=5} @target]} ~onAttack 0.3
 
