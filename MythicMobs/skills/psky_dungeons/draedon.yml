draedon_death:
  Cooldown: 9999
  Skills:
  - cancelevent

  - remove @MobsInRadius{r=100;types=UNCAGED_SUBJECT,INFECTED_SCIENTIST}
  - setvariable{var=target.raidchest;value="true";type=STRING} @World
  - state{s=death} @self
  - setai{ai=false} @self
  - setstance{stance=dying} @self
  - skill{s=invul} @self
  - sound{s=draedon.death;v=20} @self
  - stopsound{s=draedon.theme} @World

  - sound{s=entity.vex.death;v=20;repeat=4;repeatinterval=15} @self
  - summon{type=LOST_SOUL_DEATH;a=3;v=3;repeat=14;repeatinterval=5;y=0.8} @self
  - effect:particles{p=lava;amount=10;speed=1;repeat=7;repeatinterval=10}
  - effect:particles{p=Crimson_Spore;amount=40;speed=1;repeat=7;repeatinterval=10}
  - effect:particles{p=flash;amount=3;speed=0;hs=0.2;repeat=7;repeatinterval=10}
  - delay 80

  - sound{s=entity.generic.explode;v=20}
  - effect:particles{p=Explosion_Emitter;amount=1;speed=0;hS=0.2;vS=0.2}
  - effect:particles{p=Gust_Emitter_Large;amount=3;speed=0;hS=1;vS=1}
  - effect:particles{p=Soul;amount=400;speed=0;hS=1;vS=1}
  - effect:particles{p=Soul;amount=100;speed=1;hS=2;vS=2}

  - remove @self

  - dsignal{s=loh_finish}
  - skill{s=dungeon_completed} @world

#this plays whenever a dungeon is cleared
dungeon_completed:
  Skills:
  - sound{s=dungeonclear;audience=target}
  - sendtitle{title="<white>ꃓ";subtitle="";d=20;fo=0;fi=0} 
  - delay 2
  - sendtitle{title="<white>ꃔ";subtitle="";d=3;fo=0;fi=0} 
  - delay 2
