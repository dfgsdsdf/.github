LOH_LootChest_Diamond:
  TriggerConditions:
  - variableEquals{var=target.raidchest;value="true"} orElsecast LootChest_NoMore
  - holding{m=mmoitems.DUNGEON_KEY.CHAMBER_DIAMOND_KEY} orElsecast LootChest_Nokey
  Skills:
  - consumeslot{slot=HAND;amount=1} @trigger
  - sound{s=block.chest.open;p=0} @trigger
  - message{m="<gold><bold>CHEST UNLOCKED!</bold> <#cfcfcf>You have looted this chest!"} @trigger
  - giveitem{i=loh_diamondchest;fl=true} @trigger ?~!dungeondifficulty{d=MASTER}
  - giveitem{i=loh_diamondchest_master;fl=true} @trigger ?~dungeondifficulty{d=MASTER}
  - variableUnset{var=target.raidchest} @trigger

