LootChest_Nokey:
  Skills:
  - sound{s=entity.villager.no} @trigger
  - message{m="<white>ꀓ <#e55039>You don't have a raid chest key!"} @trigger
LootChest_NoMore:
  Skills:
  - sound{s=entity.villager.no} @trigger
  - message{m="<white>ꀓ <#e55039>You can only open one chest per dungeon run!"} @trigger

#this plays whenever a grimoire is acquired
grimoire_acquired:
  Skills:
  - sound{s=grimoireacquired;audience=self}
  - sendtitle{title="<white>ꃃ";subtitle="";d=20;fo=9;fi=0} @self
  - delay 2
  - sendtitle{title="<white>ꃄ";subtitle="";d=20;fo=9} @self
  - delay 2
  - sendtitle{title="<white>ꃅ";subtitle="";d=20;fo=9} @self
  - delay 2
  - sendtitle{title="<white>ꃆ";subtitle="";d=20;fo=9} @self
  - delay 2
  - sendtitle{title="<white>ꃇ";subtitle="";d=20;fo=9} @self
  - delay 2
  - sendtitle{title="<white>ꃈ";subtitle="";d=20;fo=9} @self
  - delay 2
  - sendtitle{title="<white>ꃉ";subtitle="";d=20;fo=9} @self
  - delay 2
  - sendtitle{title="<white>ꃊ";subtitle="";d=100;fo=20} @self