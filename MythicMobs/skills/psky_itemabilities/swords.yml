gilded_netherite_sword:
  Conditions:
  - hascurrency{a=100} true
  Skills:
  - currencytake{amount=100} @self
  - mmodamage{amount=2;types=ON-HIT}

soul_netherite_sword:
  Skills:
  - heal{a=1}
  - command{c="mythiclib tempstat add <caster.name> WEAPON_DAMAGE 3 100"}

warden_sword:
  Skills:
  - projectile{onTick=wardensword-Tick;onHit=wardensword-Hit;onEndSkill=wardensword-End;v=40;i=1;hR=1;vR=1;se=false;sb=true;hp=false;hnp=true;mr=20} @targetlocation
  - sound{s=entity.warden.sonic_boom;audience=self} @self
wardensword-Tick:
  Skills:
  - effect:particles{p=Sonic_Boom;amount=1;speed=0;hS=0.2;vS=0.2} @origin 
wardensword-Hit:
  Skills:
  - mmodamage{a=7}
  - variableadd{var=caster.sonicenergy;amount=2} @self

hextech_sword:
  Conditions:
  - variableInRange{var=caster.hexenergy;value=>49} orElsecast hextech_energy_notenough
  Skills:
  - projectile{onTick=hextechsword-Tick;onHit=hextechsword-Hit;onEndSkill=hextechsword-End;v=60;i=1;hR=2;vR=2;se=false;sb=true;hp=false;hnp=true;mr=20} @targetlocation
  - variablesubtract{var=caster.hexenergy;amount=50} @self
  - sound{s=entity.blaze.shoot;audience=self} @self
  - command{c="ml tempstat add <caster.name> PVE_DAMAGE 50 200"} @self ?stringequals{val1="%mythiclib_stat_custom_hextech_ascension_count%";val2=1}
hextechsword-Tick:
  Skills:
  - effect:particles{p=Wax_Off;amount=2;speed=0;hS=0;vS=0} @origin 
  - effect:particles{p=Large_Smoke;amount=15;speed=0;hS=1;vS=1} @origin 
  - effect:particles{p=lava;amount=3;speed=0;hS=0.2;vS=0.2} @origin 
  - effect:particles{p=reddust;color=#ffdef5;amount=15;speed=0;hS=0.5;vS=0.5;y=0} @origin
  - effect:particles{p=reddust;color=#ab8ca2;amount=15;speed=0;hS=0.5;vS=0.5;y=0} @origin
hextechsword-Hit:
  Skills:
  - effect:particles{p=Gust;amount=2;speed=0;hS=0.1;vS=0;y=0.6}
  - mmodamage{a=40}
  - potion{t=SLOWNESS;d=100;l=1}
  - potion{t=WEAKNESS;d=100;l=1}
  - potion{t=WITHER;d=100;l=2}